blueprint:
  name: Sonoff SNZB-01M (ZHA)
  description: >
    ZHA blueprint for the Sonoff SNZB‑01M using zha_event. Supports 4 buttons
    (endpoints 1–4), each providing single, double, triple and long press actions
    — 16 actions in total.

    Uses the actual ZHA commands emitted by the SNZB‑01M
    (FC12 cluster). Requires either native ZHA support for this model or an
    appropriate quirk enabling correct FC12 event mapping.

    Physical button embossing:
      • Top Left    → one dot
      • Top Right   → two dots
      • Bottom Left → three dots
      • Bottom Right → four dots

  domain: automation
  author: jam3

  input:
    remote:
      name: Sonoff SNZB-01M Remote
      description: Select the remote from the device list
      selector:
        device:
          integration: zha
          manufacturer: SONOFF

    automation_mode:
      name: Automation mode
      description: >
        Only one automation mode can be used for all buttons.
        Automation modes documentation:
        https://www.home-assistant.io/docs/automation/modes/
      default: queued
      selector:
        select:
          options:
            - queued
            - single
            - restart
            - parallel

    # -------- BUTTON 1 --------
    button1_single:
      name: Button 1 – Single press
      default: []
      selector: { action: {} }

    button1_double:
      name: Button 1 – Double press
      default: []
      selector: { action: {} }

    button1_triple:
      name: Button 1 – Triple press
      default: []
      selector: { action: {} }

    button1_long:
      name: Button 1 – Long press
      default: []
      selector: { action: {} }

    # -------- BUTTON 2 --------
    button2_single:
      name: Button 2 – Single press
      default: []
      selector: { action: {} }

    button2_double:
      name: Button 2 – Double press
      default: []
      selector: { action: {} }

    button2_triple:
      name: Button 2 – Triple press
      default: []
      selector: { action: {} }

    button2_long:
      name: Button 2 – Long press
      default: []
      selector: { action: {} }

    # -------- BUTTON 3 --------
    button3_single:
      name: Button 3 – Single press
      default: []
      selector: { action: {} }

    button3_double:
      name: Button 3 – Double press
      default: []
      selector: { action: {} }

    button3_triple:
      name: Button 3 – Triple press
      default: []
      selector: { action: {} }

    button3_long:
      name: Button 3 – Long press
      default: []
      selector: { action: {} }

    # -------- BUTTON 4 --------
    button4_single:
      name: Button 4 – Single press
      default: []
      selector: { action: {} }

    button4_double:
      name: Button 4 – Double press
      default: []
      selector: { action: {} }

    button4_triple:
      name: Button 4 – Triple press
      default: []
      selector: { action: {} }

    button4_long:
      name: Button 4 – Long press
      default: []
      selector: { action: {} }

# ───────── AUTOMATION PART ─────────

mode: !input automation_mode
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      endpoint: "{{ trigger.event.data.endpoint_id | int }}"
      command: "{{ trigger.event.data.command }}"

  - choose:
      - conditions: '{{ endpoint == 1 and command == "single" }}'
        sequence: !input button1_single
      - conditions: '{{ endpoint == 1 and command == "double" }}'
        sequence: !input button1_double
      - conditions: '{{ endpoint == 1 and command == "triple" }}'
        sequence: !input button1_triple
      - conditions: '{{ endpoint == 1 and command == "hold" }}'
        sequence: !input button1_long

      - conditions: '{{ endpoint == 2 and command == "single" }}'
        sequence: !input button2_single
      - conditions: '{{ endpoint == 2 and command == "double" }}'
        sequence: !input button2_double
      - conditions: '{{ endpoint == 2 and command == "triple" }}'
        sequence: !input button2_triple
      - conditions: '{{ endpoint == 2 and command == "hold" }}'
        sequence: !input button2_long

      - conditions: '{{ endpoint == 3 and command == "single" }}'
        sequence: !input button3_single
      - conditions: '{{ endpoint == 3 and command == "double" }}'
        sequence: !input button3_double
      - conditions: '{{ endpoint == 3 and command == "triple" }}'
        sequence: !input button3_triple
      - conditions: '{{ endpoint == 3 and command == "hold" }}'
        sequence: !input button3_long

      - conditions: '{{ endpoint == 4 and command == "single" }}'
        sequence: !input button4_single
      - conditions: '{{ endpoint == 4 and command == "double" }}'
        sequence: !input button4_double
      - conditions: '{{ endpoint == 4 and command == "triple" }}'
        sequence: !input button4_triple
      - conditions: '{{ endpoint == 4 and command == "hold" }}'
        sequence: !input button4_long
